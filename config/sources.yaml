# TechRadar source registry.
# blogs/youtube: add any RSS-capable source. For a YouTube channel, use its
# feed URL: https://www.youtube.com/feeds/videos.xml?channel_id=CHANNEL_ID
# (find channel_id via the channel's page source or a lookup tool).

hackernews:
  enabled: true
  min_score: 80          # skip low-signal posts
  max_items: 60

github_trending:
  enabled: true
  since: daily            # daily | weekly | monthly
  languages: [""]         # "" = all languages; add e.g. "python", "typescript"

reddit:
  enabled: true
  subreddits: ["selfhosted", "LocalLLaMA", "chemistry", "MaterialsScience", "nanotechnology"]
  min_score: 50            # skip low-upvote posts
  max_items: 20            # per subreddit
  time_window: day         # hour | day | week | month | year | all

arxiv:
  enabled: true
  categories:
    - "cs.AI"
    - "cs.CL"
    - "cs.RO"             # robotics -- matches mechatronics/manufacturing interest
    - "cond-mat.mtrl-sci" # materials science
    - "physics.chem-ph"   # chemical physics
    - "cond-mat.soft"     # soft matter
  max_items: 30

