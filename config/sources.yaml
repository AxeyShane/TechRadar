# --- Discovery sweeps (TOAST-1 / LLM) -------------------------------
# techradar sweep  goes OUT and finds NEW items on these topics, beyond
# your subscribed feeds. provider: llm uses your existing LLM (OpenRouter /
# local); provider: mixedbread uses Mixedbread's TOAST-1 search agent
# (needs MIXEDBREAD_API_KEY in ~/.techradar/.env). Set enabled: true to
# also run sweeps as part of `techradar fetch`.
discovery:
  enabled: false
  provider: llm
  topics:
    - "new open-source tools for running LLMs locally on consumer GPUs"
    - "notable results in robotics manipulation / embodied AI"
    - "materials science and nanotech breakthroughs"
  max_items: 10
  days: 7


# --- Patent watch (the earliest "front row") ---------------------------
# techradar patents  surfaces newly-published patents in your domains the
# moment they appear in the public patent index -- ahead of the YouTube/blog
# coverage. Uses an authoritative index (Google Patents: US/EP/WIPO/CN),
# filters to the last N days, and curates+ranks via your LLM.
patents:
  days: 30
  max_items: 10
  keywords:
    - "3d printer hotend"
    - "multi-material 3d printing"
    - "nozzle changer"
    - "additive manufacturing vision"
    - "robotic gripper"
    - "automation manufacturing"
